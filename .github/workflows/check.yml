name: ci

on:
  pull_request:
    branches: [dev, release]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      REDIS_URL: redis://localhost:6379
      TEST_INTERVAL: 600

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build
